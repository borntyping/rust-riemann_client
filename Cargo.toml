[package]
authors = [
  "Sam Clements <sam@borntyping.co.uk>",
  "Elias Engel <engel@weriomat.com>",
]
description = "A Riemann client library"
edition = "2018"
license = "MIT"
name = "riemann_client"
repository = "https://github.com/borntyping/rust-riemann_client"
version = "0.10.0"

[[bin]]
name = "riemann-cli"
path = "src/main.rs"
test = false

[dependencies]
gethostname = "1.1.0"
protobuf = "3.7.2"
rustls = "0.23"

[build-dependencies]
protobuf-codegen = "3.7.2"

[dependencies.docopt]
optional = true
version = "1.1.1"

[dependencies.serde]
optional = true
version = "1.0.228"

[features]
default = ["docopt", "serde"]

[lib]
doctest = false
name = "riemann_client"
